name: Refresh Wargaming Data

on:
  schedule:
    - cron: "17 8 * * *"

  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: update-wargaming-data
  cancel-in-progress: false

jobs:
  update:
    name: Refresh data

    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------------------
      # Repository setup
      # ---------------------------------------------------------------------

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ---------------------------------------------------------------------
      # Validate before generating new public data
      # ---------------------------------------------------------------------

      - name: Run tests
        run: npm test

      # ---------------------------------------------------------------------
      # Refresh normalized Wargaming datasets
      # ---------------------------------------------------------------------

      - name: Refresh normalized data
        env:
          WG_APPLICATION_ID: ${{ secrets.WG_APPLICATION_ID }}
        run: npm run update

      # ---------------------------------------------------------------------
      # Determine whether the generated data actually changed
      # ---------------------------------------------------------------------

      - name: Detect normalized data changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- public/v1; then
            echo "No normalized data changed."
            echo "data_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Normalized data changed."
            echo "data_changed=true" >> "$GITHUB_OUTPUT"
          fi

      # ---------------------------------------------------------------------
      # Commit only when generated data changed
      #
      # Commits created with GITHUB_TOKEN do not trigger ordinary push
      # workflows, so Pages is dispatched explicitly in the following step.
      # ---------------------------------------------------------------------

      - name: Commit changed data
        if: steps.changes.outputs.data_changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/v1
          git commit -m "chore(data): refresh Wargaming data"
          git push

      # ---------------------------------------------------------------------
      # Deploy the newly committed data through the standard Pages workflow
      #
      # workflow_dispatch is intentionally used here because GitHub allows a
      # GITHUB_TOKEN-created workflow_dispatch event to start another workflow.
      #
      # This keeps all Pages implementation details centralized in pages.yml
      # and github-automation-library, exactly like the other WoWS projects.
      # ---------------------------------------------------------------------

      - name: Deploy updated data
        if: steps.changes.outputs.data_changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run pages.yml \
            --repo "${{ github.repository }}" \
            --ref main