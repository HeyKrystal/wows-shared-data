name: Refresh Wargaming Data

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-wargaming-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    outputs:
      data_changed: ${{ steps.changes.outputs.data_changed }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Refresh normalized data
        env:
          WG_APPLICATION_ID: ${{ secrets.WG_APPLICATION_ID }}
        run: npm run update

      - name: Detect normalized data changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- public/v1; then
            echo "No normalized data changed."
            echo "data_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Normalized data changed."
            echo "data_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit changed data
        if: steps.changes.outputs.data_changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/v1
          git commit -m "chore(data): refresh Wargaming data"
          git push

      - name: Configure GitHub Pages
        if: steps.changes.outputs.data_changed == 'true'
        uses: actions/configure-pages@v5

      - name: Upload static data
        if: steps.changes.outputs.data_changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: update
    if: needs.update.outputs.data_changed == 'true'

    concurrency:
      group: pages
      cancel-in-progress: true

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4