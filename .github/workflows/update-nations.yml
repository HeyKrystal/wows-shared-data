name: Refresh Nation Icons

on:
  workflow_dispatch:
    inputs:
      commit_changes:
        description: Commit changed nation and ship data
        required: true
        type: boolean
        default: false
      vortex_endpoint:
        description: Vortex GraphQL glossary endpoint
        required: true
        type: string
        default: https://vortex.worldofwarships.com/api/graphql/glossary/
      language:
        description: Nation-label language code
        required: true
        type: string
        default: en

permissions:
  contents: write

concurrency:
  group: refresh-wows-nation-icons
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Fetch nation icon metadata
        id: nations
        env:
          VORTEX_GLOSSARY_URL: ${{ inputs.vortex_endpoint }}
          NATION_LANGUAGE: ${{ inputs.language }}
        run: |
          if [[ "${{ inputs.commit_changes }}" == "true" ]]; then
            npm run update:nations
          else
            npm run update:nations -- --dry-run
          fi

      - name: Rebuild ships with nation icons
        if: ${{ inputs.commit_changes }}
        env:
          WG_APPLICATION_ID: ${{ secrets.WG_APPLICATION_ID }}
          DATASETS: ships
        run: npm run update

      - name: Commit changed data
        if: ${{ inputs.commit_changes }}
        run: |
          if git diff --quiet -- public/v1; then
            echo "No normalized data changed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/v1/nations.json public/v1/ships.json public/v1/manifest.json
          git commit -m "chore(data): refresh nation icons"
          git push
